name: Supabase Keep-Alive

# Free Supabase projects pause after ~7 days of inactivity (and are deleted after
# ~90 days paused). This workflow issues a tiny real Postgres read a few times a
# week so the project always counts as active. It touches the `exercises` table,
# which is world-readable (RLS: exercises_select_all using(true)), so only the
# public anon/publishable key is needed.
#
# Setup (one-time): add two repository secrets under
#   Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_URL       e.g. https://xxxxxxxxxxxx.supabase.co  (no trailing slash)
#     SUPABASE_ANON_KEY  the anon / publishable key from Settings → API
#
# Note: GitHub auto-disables scheduled workflows after 60 days with no repo
# activity. Ongoing commits (or a manual run) keep it enabled.

on:
  schedule:
    # 06:00 UTC on Mon / Wed / Fri — max gap ~3 days, well under the 7-day limit.
    - cron: '0 6 * * 1,3,5'
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (touches Postgres)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY repo secrets are not set."
            exit 1
          fi

          # Strip any trailing slash so the URL joins cleanly.
          base="${SUPABASE_URL%/}"
          endpoint="$base/rest/v1/exercises?select=id&limit=1"

          echo "Pinging $base/rest/v1/exercises ..."
          status=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --max-time 30 \
            "$endpoint")

          echo "HTTP status: $status"
          echo "Response body: $(cat /tmp/body.txt)"

          # 2xx = healthy. Anything else means the project is paused/gone/misconfigured.
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Keep-alive ping failed (HTTP $status). Project may be paused, deleted, or the secrets are wrong."
            exit 1
          fi

          echo "Supabase project is alive."
