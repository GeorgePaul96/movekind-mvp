    body {

    /* Spring Bottom Sheet Modal Entrance */
    @keyframes sheetSpringUp {

      }
      100% {
        transform: translateY(0);
        opacity: 1;

<script>
  (function() {
    // Particle spawner helper
    function spawnParticles(originEl, emojis = ['🌸', '🍃', '✨', '🌿']) {
      const rect = originEl.getBoundingClientRect();
      const count = 6;
      for (let i = 0; i < count; i++) {
        const particle = document.createElement('span');
        particle.className = 'leaf-particle';
        particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        
        const startX = rect.left + rect.width / 2 + (Math.random() * 24 - 12);
        const startY = rect.top + rect.height / 2 + (Math.random() * 12 - 6);
        const tx = (Math.random() * 60 - 30) + 'px';
        const ty = (-(Math.random() * 45 + 25)) + 'px';
        const tr = (Math.random() * 90 - 45) + 'deg';

        particle.style.left = startX + 'px';
        particle.style.top = startY + 'px';
        particle.style.setProperty('--tx', tx);
        particle.style.setProperty('--ty', ty);
        particle.style.setProperty('--tr', tr);

        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 800);
      }
    }

    // Activity Chips Selection Micro-Interactions
    const activityChips = document.querySelectorAll('.activity-chip');
    activityChips.forEach(chip => {
      chip.addEventListener('click', (e) => {
        activityChips.forEach(c => {
          c.classList.remove('bg-primary-sage', 'text-on-primary', 'shadow-[0_4px_14px_rgba(89,158,124,0.3)]');
          c.classList.add('bg-surface-container', 'text-on-surface-variant');
          const txt = c.querySelector('.activity-text');
          if (txt) txt.classList.remove('font-semibold');
          const icon = c.querySelector('.activity-icon');
          if (icon) icon.classList.add('hidden');
        });
        
        chip.classList.add('bg-primary-sage', 'text-on-primary', 'shadow-[0_4px_14px_rgba(89,158,124,0.3)]');
        chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
        const activeTxt = chip.querySelector('.activity-text');
        if (activeTxt) activeTxt.classList.add('font-semibold');
        const activeIcon = chip.querySelector('.activity-icon');
        if (activeIcon) {
          activeIcon.classList.remove('hidden');
          activeIcon.style.transform = 'scale(0.5)';
          requestAnimationFrame(() => {
            activeIcon.style.transform = 'scale(1)';
          });
        }

        // Particle burst
        spawnParticles(chip, ['🌿', '🌱', '✨']);
      });
    });

    // Duration Chips Selection
    const durationChips = document.querySelectorAll('.duration-chip');
    const badge = document.getElementById('duration-badge');
    durationChips.forEach(chip => {
      chip.addEventListener('click', () => {
        durationChips.forEach(d => {
          d.classList.remove('bg-primary-sage', 'text-on-primary', 'shadow-[0_4px_14px_rgba(89,158,124,0.3)]', 'font-semibold');
          d.classList.add('bg-surface-container', 'text-on-surface-variant', 'font-medium');
        });
        chip.classList.add('bg-primary-sage', 'text-on-primary', 'shadow-[0_4px_14px_rgba(89,158,124,0.3)]', 'font-semibold');
        chip.classList.remove('bg-surface-container', 'text-on-surface-variant', 'font-medium');
        
        const mins = chip.getAttribute('data-minutes');
        if (badge) {
          badge.textContent = mins === '60+' ? '60+ mins' : mins + ' mins';
          badge.classList.remove('badge-pop');
          void badge.offsetWidth; // trigger reflow
          badge.classList.add('badge-pop');
        }
      });
    });

    // Encouragement Card Tap Sparkle
    const encouragementCard = document.getElementById('encouragement-card');
    const sproutEmoji = document.getElementById('sprout-emoji');
    if (encouragementCard) {
      encouragementCard.addEventListener('click', () => {
        spawnParticles(sproutEmoji || encouragementCard, ['🌸', '✨', '🌱', '🌼']);
        if (sproutEmoji) {
          sproutEmoji.style.transform = 'scale(1.35) rotate(15deg)';
          setTimeout(() => {
            sproutEmoji.style.transform = '';
          }, 350);
        }
      });
    }

    // Primary CTA Button with blossom celebration
    const confirmBtn = document.getElementById('confirm-btn');
    const confirmBtnIcon = document.getElementById('confirm-btn-icon');
    let isSubmitting = false;

    if (confirmBtn) {
      confirmBtn.addEventListener('click', () => {
        if (isSubmitting) return;
        isSubmitting = true;

        spawnParticles(confirmBtn, ['🌸', '🌺', '🌼', '✨', '🍃', '🌱']);
        
        confirmBtn.innerHTML = `
          <div class="shimmer-layer"></div>
          <span class="relative z-10 font-semibold tracking-wide">Sprouting blossoms...</span>
          <span class="material-symbols-outlined text-[20px] relative z-10 animate-spin" style="font-variation-settings: 'FILL' 1;">eco</span>
        `;
        confirmBtn.classList.remove('shadow-[0_10px_28px_rgba(89,158,124,0.32)]');
        confirmBtn.classList.add('bg-[#488366]', 'shadow-[0_4px_14px_rgba(72,131,102,0.4)]');

        setTimeout(() => {
          confirmBtn.innerHTML = `
            <span class="relative z-10 font-semibold tracking-wide">Blossomed!</span>
            <span class="material-symbols-outlined text-[20px] relative z-10" style="font-variation-settings: 'FILL' 1;">check_circle</span>
          `;
          spawnParticles(confirmBtn, ['🌸', '🌺', '💖']);
          setTimeout(() => {
            history.back();
          }, 450);
        }, 650);
      });
    }
  })();
</script></main></body></html>
