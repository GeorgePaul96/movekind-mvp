<script>
  (function initGentleBreathingRitual() {
    const pill = document.getElementById('breathePill');
    const text = document.getElementById('breatheText');
    if (!pill || !text) return;

    let isInhale = true;
    setInterval(() => {
      if (isInhale) {
        pill.classList.add('scale-105', 'bg-primary-fixed');
        pill.classList.remove('bg-surface-container-lowest');
        text.innerText = 'Breathe out. Soften your shoulders.';
      } else {
        pill.classList.remove('scale-105', 'bg-primary-fixed');
        pill.classList.add('bg-surface-container-lowest');
        text.innerText = 'Breathe in. Take your time.';
      }
      isInhale = !isInhale;
    }, 4000);
  })();
