</div>
<script>
  // Simple delightful micro-interaction for birds on input focus
  const nameInput = document.getElementById('name-input');
  const bird1 = document.getElementById('bird-lavender');
  const bird2 = document.getElementById('bird-mint');

  if (nameInput && bird1 && bird2) {
    nameInput.addEventListener('focus', () => {
      bird1.style.transform = 'translateY(-3px) rotate(-2deg)';
      bird2.style.transform = 'translateY(-3px) rotate(2deg)';
    });

    nameInput.addEventListener('blur', () => {
      bird1.style.transform = 'translateY(0) rotate(0deg)';
      bird2.style.transform = 'translateY(0) rotate(0deg)';
    });
  }
</script></main></body></html>
